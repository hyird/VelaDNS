plugins:
  # Unbound owns encrypted transport, caching, and DNSSEC validation. Keeping
  # the secure MosDNS path on loopback avoids duplicating trust decisions.
  - tag: secure_unbound
    type: forward
    args:
      upstreams:
        - tag: unbound_secure
          addr: 127.0.0.1:5306

  - tag: secure_cache
    type: cache
    args:
      size: 8192
      lazy_cache_ttl: 0

  - tag: secure_real_path
    type: sequence
    args:
      - exec: $secure_cache
      - exec: $secure_unbound

  # The main classifier targets the same entry in both runtime modes.
  - tag: validated_foreign_path
    type: sequence
    args:
      - exec: veladns_decision secure_non_cn
      - exec: accept

  - tag: foreign_path
    type: sequence
    args:
      - exec: veladns_decision secure_foreign
      - exec: goto secure_real_path
