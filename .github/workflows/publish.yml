name: Test and publish GHCR image

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * *'

concurrency:
  group: veladns-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/veladns

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go checks
        run: |
          go test ./...
          go vet ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: veladns:test
          platforms: linux/amd64
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

      - name: Verify optimized image shape
        run: |
          layers="$(docker image inspect veladns:test --format '{{len .RootFS.Layers}}')"
          size="$(docker image inspect veladns:test --format '{{.Size}}')"
          test "$layers" -eq 1
          printf 'filesystem_layers=%s image_size_bytes=%s\n' "$layers" "$size"

      - name: Run integration tests
        run: sh tests/integration.sh veladns:test

  architecture-smoke:
    name: smoke (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            tag: arm64
          - platform: linux/arm/v7
            tag: arm-v7
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build architecture smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: veladns:${{ matrix.tag }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

      - name: Execute MosDNS under QEMU
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            --entrypoint /usr/local/bin/mosdns \
            "veladns:${{ matrix.tag }}" version | grep '^v5\.3\.4-veladns$'
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            --entrypoint /usr/local/bin/veladns \
            "veladns:${{ matrix.tag }}" version | grep '^v5\.3\.4-veladns$'

  publish:
    needs:
      - test
      - architecture-smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=VelaDNS
            org.opencontainers.image.description=Fail-closed anti-pollution split DNS for RouterOS and Mihomo

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=linux-amd64
            type=gha,scope=arm64
            type=gha,scope=arm-v7
          provenance: mode=max
          sbom: true

      - name: Inspect published manifest
        run: docker buildx imagetools inspect "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
